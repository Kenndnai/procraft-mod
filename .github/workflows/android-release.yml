name: Android Release

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_VERSION: "1.99.0"
  NDK_VERSION: "29.0.14206865"

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Resolve version
        run: |
          listed="$(sed -n 's/^procraft\.version=//p' android/gradle.properties | tr -d '\r')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$listed"; fi
          echo "version=$v" >>"$GITHUB_OUTPUT"
          echo "### v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android

      - name: Install cargo-ndk and the Android NDK
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >>"$GITHUB_ENV"

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PROCRAFT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/release.p12"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 -alias procraft -keyalg RSA -keysize 2048 -validity 10000 -storepass procraft -keypass procraft -dname "CN=ProCraft, O=ProCraft, C=ID"
            echo "PROCRAFT_KEYSTORE_PASSWORD=procraft" >>"$GITHUB_ENV"
            echo "PROCRAFT_KEY_ALIAS=procraft" >>"$GITHUB_ENV"
            echo "PROCRAFT_KEY_PASSWORD=procraft" >>"$GITHUB_ENV"
          fi
          echo "PROCRAFT_KEYSTORE=$RUNNER_TEMP/release.p12" >>"$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK (arm64-v8a)
        working-directory: android
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ./gradlew --no-daemon :app:assembleRelease "-Pprocraft.abis=arm64-v8a" "-Pprocraft.version=$VERSION"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/procraft-$VERSION-android-arm64.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: procraft-apk
          path: dist/*

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag_name="${GITHUB_REF_NAME:-v0.0.7-beta}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            tag_name="v0.0.7-beta"
          fi
          (cd dist && sha256sum -- * >SHA256SUMS.txt)
          gh release create "$tag_name" \
            --title "ProCraft $tag_name (Optimized for Helio G100 & 4GB RAM)" \
            --notes "### ProCraft Optimized Build
- Optimized for Android 16 & Helio G100 Ultra (RAM 4 GB)
- Canvas A4 & high-DPI memory allocation fixes
- GPU work chunk size reduced to prevent driver timeouts on Mali GPUs
- Undo history limits reduced to prevent OOM
- System memory reserve increased to 768 MB" \
            dist/* || \
          gh release upload "$tag_name" dist/* --clobber
