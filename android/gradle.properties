org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The Rust library's ABIs: arm64-v8a for Helio G100 Ultra and modern 64-bit ARM devices
procraft.abis=arm64-v8a

# The app's version and its version code (before the ABI digit: see app/build.gradle.kts, the build
# checks the two agree). A release tag v<version> must name this version.
procraft.version=0.0.7-beta
procraft.versionCode=701
